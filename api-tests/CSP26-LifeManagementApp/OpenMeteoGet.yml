info:
  name: OpenMeteoGet
  type: http
  seq: 2

http:
  method: GET
  url: "{{weatherBase}}/v1/forecast?latitude=63.10&longitude=21.62&current=temperature_2m,wind_speed_10m&wind_speed_unit=ms"
  params:
    - name: latitude
      value: "63.10"
      type: query
    - name: longitude
      value: "21.62"
      type: query
    - name: current
      value: temperature_2m,wind_speed_10m
      type: query
    - name: wind_speed_unit
      value: ms
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
